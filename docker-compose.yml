version: '3.8'

services:
  wifi-guest:
    build: .
    container_name: wifi-guest-manager
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./wifi_guest.db:/app/wifi_guest.db
      - ./active_passes.json:/app/active_passes.json
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=${APP_PORT:-8000}
